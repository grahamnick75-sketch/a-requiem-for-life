name: Attach campaign notes update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-campaign-update-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link notes update from dashboard HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          tag='<script src="campaign-update-v4.js"></script>'
          if tag not in s:
              assert '</body>' in s, "Page format changed; not patching"
              p.write_text(s.replace('</body>',tag+'</body>',1),encoding="utf-8")
          PY
      - name: Commit linked dashboard update
        run: |
          git add index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Connect new Chinatown and Haight campaign notes to dashboard"
            git push
          fi
