name: Install Dogpatch campaign dashboard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-dogpatch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect Ferryman and Dogpatch data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          tag='<script src="campaign-update-v5.js"></script>'
          assert '</body>' in s, 'Dashboard template not found'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Publish changes
        run: |
          git add index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Load Dogpatch and Ferryman campaign notes in live dashboard"
            git push
          fi
